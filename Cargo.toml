[package]
name = "tty1"
version = "0.5.2"
edition = "2024"
rust-version = "1.99"
description = "Fast, minimal dashboard aggregating trending content from Hacker News, GitHub, and Reddit"
license = "MIT"

[dependencies]
arc-swap = "1"
axum = "0.8"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
fastrand = "2"
flate2 = "1"
futures = "0.3"
maud = { version = "0.27", features = ["axum"] }
# native-tls-vendored: Reddit fingerprints rustls and blocks it; vendored OpenSSL
# statically links OpenSSL into the binary so distroless images need no system libssl.
reqwest = {
  version = "0.13",
  default-features = false,
  features = [
    "brotli",
    "cookies",
    "deflate",
    "gzip",
    "json",
    "native-tls",
    "socks",
  ],
}
reqwest-middleware = "0.5"
reqwest-tracing = "0.7"
scraper = { version = "0.29", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# CSP script hashes. Base64 is a local helper, not a second dependency.
sha2 = "0.11"
thiserror = "2"
tokio = {
  version = "1",
  features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"],
}
tower = { version = "0.5", features = ["timeout"] }
tower-http = {
  version = "0.7",
  features = ["compression-gzip", "compression-zstd"],
}
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zstd = { version = "0.14", default-features = false }

[features]
default = []
# Statically link OpenSSL for distroless/published images. Local builds use the
# system OpenSSL and skip compiling openssl-src.
vendored-tls = ["reqwest/native-tls-vendored"]

[profile.release]
opt-level = "z"
strip = true
# Thin LTO with parallel codegen is much faster to build than fat LTO with one
# codegen unit. This app is I/O-bound, so the small size/perf trade is free.
lto = "thin"
codegen-units = 16
