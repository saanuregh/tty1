services:
  state-init:
    image: busybox:1.38-musl@sha256:ea2b9914a16a4ac1981994af97b318f7c7d4db76b580c56177f08bf76f4a0be8
    user: "0:0"
    command: ["chown", "-R", "65532:65532", "/state"]
    restart: "no"
    volumes:
      - tty1-state:/state

  tty1:
    build: .
    ports:
      - "3000:3000"
    depends_on:
      state-init:
        condition: service_completed_successfully
    user: "65532:65532"
    environment:
      - RUST_LOG=info
      # Reddit blocks many datacenter ranges. Proxies Reddit only.
      # - REDDIT_PROXY=socks5h://user:pass@host:1080
    restart: unless-stopped
    volumes:
      - tty1-state:/state

volumes:
  tty1-state:
