services:
  tty1:
    build: .
    ports:
      - "3000:3000"
    environment:
      - RUST_LOG=info
      # Reddit blocks many datacenter ranges. Proxies Reddit only.
      # - REDDIT_PROXY=socks5h://user:pass@host:1080
    restart: unless-stopped
    volumes:
      - tty1-state:/state

volumes:
  tty1-state:
